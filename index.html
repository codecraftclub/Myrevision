    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDA1XwfYzlPCL_Soxia0d-JpNekGGCaJMM",
            authDomain: "mypscrevison.firebaseapp.com",
            projectId: "mypscrevison",
            storageBucket: "mypscrevison.firebasestorage.app",
            messagingSenderId: "89979950079",
            appId: "1:89979950079:web:707815264541bba457cdca",
            measurementId: "G-GC849S4G0N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveToFirebase = async function(customName, itemsArray, collectionName = "revision_sets") {
            try {
                await addDoc(collection(db, collectionName), {
                    name: customName,
                    items: itemsArray,
                    createdAt: new Date().toISOString()
                });
                alert(`✓ "${customName}" ഫയർബേസിൽ വിജയകരമായി സേവ് ചെയ്തു!`);
            } catch (e) {
                console.error("Firebase Error: ", e);
            }
        };

        window.loadFromFirebase = async function(collectionName = "revision_sets") {
            try {
                let querySnapshot = await getDocs(collection(db, collectionName));
                let sets = [];
                querySnapshot.forEach((document) => {
                    sets.push({ id: document.id, ...document.data() });
                });
                return sets;
            } catch (e) { return []; }
        };

        window.deleteFromFirebaseDoc = async function(docId, collectionName = "revision_sets") {
            try {
                await deleteDoc(doc(db, collectionName, docId));
                alert("സെറ്റ് വിജയകരമായി ഡിലീറ്റ് ചെയ്തു!");
            } catch (e) {
                console.error("Firebase Delete Error: ", e);
            }
        };
    </script>

        function playErrorSound() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {}
        }

        function getRevisionStatus(topicId) {
            let mockDateStr = localStorage.getItem(`rev_date_mock_${topicId}`);
            let flashDateStr = localStorage.getItem(`rev_date_flash_${topicId}`);
            let dates = [];
            if (mockDateStr) dates.push(new Date(mockDateStr));
            if (flashDateStr) dates.push(new Date(flashDateStr));

            if (dates.length === 0) return 'new';

            let lastDate = new Date(Math.max(...dates));
            let today = new Date();
            let diffDays = Math.floor((today - lastDate) / (1000 * 60 * 60 * 24));

            let intervals = [1, 3, 7, 14, 30];
            let targetDay = null;

            for (let interval of intervals) {
                if (diffDays <= interval) {
                    targetDay = interval;
                    break;
                }
            }

            if (targetDay === null) return 'overdue';

            if (diffDays === targetDay) return 'today'; 
            if (diffDays === targetDay - 1) return 'tomorrow'; 
            if (diffDays > targetDay) return 'overdue'; 

            return 'safe';
        }

        function getModuleNotificationClass(modKey) {
            let topics = moduleData[modKey];
            let hasRed = false;
            let hasOrange = false;
            let hasYellow = false;
            let hasTopics = false;

            topics.forEach(cat => {
                cat.topics.forEach(t => {
                    hasTopics = true;
                    let status = getRevisionStatus(t.id);
                    if (status === 'overdue') hasRed = true;
                    if (status === 'today') hasOrange = true;
                    if (status === 'tomorrow') hasYellow = true;
                });
            });

            if (!hasTopics) return '';
            if (hasRed) return 'blink-red';
            if (hasOrange) return 'blink-orange';
            if (hasYellow) return 'blink-yellow';
            return '';
        }

        // മോക്ക് ടെസ്റ്റ് ഫങ്ഷൻ

        window.openSpecificMock = function(subId, title) {
            selectedSubtopicId = subId;
            selectedSubtopicTitle = title;
            currentViewLevel = "mock";
            let qList = questionsDB[subId] || [];
            if (qList.length === 0) {
                alert('ഈ ടോപ്പിക്കിൽ ചോദ്യങ്ങൾ ഉടൻ ചേർക്കുന്നതാണ്.');
                return;
            }
            quizQuestions = JSON.parse(JSON.stringify(qList));

        function renderQuizInterface() {
            document.getElementById('home-menu').style.display = 'none';
            let viewDiv = document.getElementById('dynamic-view');
            viewDiv.style.display = 'block';
            document.getElementById('view-title').innerText = `📝 മോക്ക് ടെസ്റ്റ്: ${selectedSubtopicTitle}`;

            let q = quizQuestions[qIndex];
            let selectedOpt = userAnswers[qIndex];

            let optionsHtml = '';
            q.options.forEach((opt, i) => {
                let selClass = selectedOpt === i ? 'selected' : '';
                optionsHtml += `<div class="option-item ${selClass}" onclick="selectAns(${i})">${opt}</div>`;
            });

            let container = document.getElementById('subtopics-container');
            container.innerHTML = `
                <div class="quiz-container">
                    <div class="quiz-top-bar">
                        <span>ചോദ്യം ${qIndex + 1} / ${quizQuestions.length}</span>
                    </div>
                    <div class="question-text">${q.q}</div>
                    <div class="options-list">${optionsHtml}</div>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        ${qIndex > 0 ? '<button class="small-nav-btn" onclick="prevQuizQ()">← മുമ്പത്തെ</button>' : ''}
                        ${qIndex < quizQuestions.length - 1 ? '<button class="small-nav-btn" style="margin-left:auto;" onclick="nextQuizQ()">അടുത്തത് →</button>' : '<button class="btn-link btn-mock" style="margin-left:auto;" onclick="finishQuiz()">ടെസ്റ്റ് ഫിനിഷ് ചെയ്യുക</button>'}
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.selectAns = function(optIdx) {
            userAnswers[qIndex] = optIdx;
            renderQuizInterface();
        }

        window.nextQuizQ = function() {
            if (qIndex < quizQuestions.length - 1) { qIndex++; renderQuizInterface(); }
        }

        window.prevQuizQ = function() {
            if (qIndex > 0) { qIndex--; renderQuizInterface(); }
        }

        window.finishQuiz = function() {
            let correct = 0;
            let wrong = 0;
            quizQuestions.forEach((q, idx) => {
                if (userAnswers[idx] !== undefined) {
                    if (userAnswers[idx] === q.answer) correct++;
                    else wrong++;
                }
            });
            let score = Math.max(0, (correct * 1.0) - (wrong * 0.33)).toFixed(2);
            if (selectedSubtopicId) {
                localStorage.setItem(`rev_date_mock_${selectedSubtopicId}`, new Date().toISOString());
            }

            let container = document.getElementById('subtopics-container');
            container.innerHTML = `
                <div class="subtopic-card" style="background: #eff6ff; border-left: 5px solid #3b82f6; text-align: left; padding: 20px;">
                    <h3 style="color: #1e3a8a; margin-bottom: 10px;">📊 മോക്ക് ടെസ്റ്റ് റിസൾട്ട്</h3>
                    <p>✅ ശരിയായി ഉത്തരം നൽകിയവ: <strong>${correct}</strong></p>
                    <p>❌ തെറ്റായ ഉത്തരങ്ങൾ: <strong>${wrong}</strong></p>
                    <p style="margin-top: 8px; color: #047857; font-weight: bold;">🎯 ആകെ സ്കോർ: ${score}</p>
                </div>
                <button class="small-nav-btn" style="margin-top: 15px; width: 100%; justify-content: center;" onclick="goHome()">🏠 ഹോമിലേക്ക് പോവുക</button>
            `;
        };

        window.openFlashcardSession = function(subId, title) {
            selectedSubtopicId = subId;
            selectedSubtopicTitle = title;
            currentViewLevel = "flashcard";
            let fList = flashcardDB[subId] || [];
            if (fList.length === 0) {
                let qList = questionsDB[subId] || [];
                if (qList.length === 0) {
                    alert('ഈ ടോപ്പിക്കിൽ ഫ്ലാഷ് കാർഡുകൾ ലഭ്യമല്ല.');
                    return;
                }
                fList = qList.map(q => ({ front: q.q, back: q.options[q.answer] }));
            }
            flashCardsList = fList;
            flashIdx = 0;
            renderFlashcard();
        };

        function renderFlashcard() {
            document.getElementById('home-menu').style.display = 'none';
            let viewDiv = document.getElementById('dynamic-view');
            viewDiv.style.display = 'block';
            
            document.getElementById('view-title').innerText = `⚡ ${selectedSubtopicTitle} (ഫ്ലാഷ് കാർഡ് ${flashIdx + 1}/${flashCardsList.length})`;
            let container = document.getElementById('subtopics-container');
            let card = flashCardsList[flashIdx];

            container.innerHTML = `
                <div class="flashcard-container">
                    <div class="flash-card-scene" onclick="document.getElementById('fcard-inner').classList.toggle('flipped')">
                        <div class="flash-card-box" id="fcard-inner">
                            <div class="flash-card-face flash-card-front">
                                <span style="font-size: 0.75rem; color: #64748b; font-weight: bold; margin-bottom: 8px;">ചോദ്യം (ടോപ്പ് ക്ലിക്ക് ചെയ്യുക)</span>
                                <div style="font-size: 1.05rem; font-weight: bold;">${card.front}</div>
                            </div>
                            <div class="flash-card-face flash-card-back">
                                <span style="font-size: 0.75rem; color: #166534; font-weight: bold; margin-bottom: 8px;">ഉത്തരം</span>
                                <div style="font-size: 1.1rem; font-weight: bold;">${card.back}</div>
                            </div>
                        </div>
                    </div>
                    <div class="flash-btns">
                        <button class="btn-unknown" onclick="nextFlashCard()">അടുത്തത് →</button>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.nextFlashCard = function() {
            flashIdx++;
            if (flashIdx < flashCardsList.length) {
                renderFlashcard();
            } else {
                if(selectedSubtopicId) {
                    localStorage.setItem(`rev_date_flash_${selectedSubtopicId}`, new Date().toISOString());
                }
                alert("ഫ്ലാഷ് കാർഡ് പരിശീലനം പൂർത്തിയായി!");
                goHome();
            }
        };

        // പ്രാക്ടീസ് സെക്ഷൻ ലോജിക്
        let practiceQuestions = [];
        let practiceIndex = 0;
        let practiceDoneCount = 0;
        let practiceLearnedCount = 0;
        let practiceWrongList = [];
        let isWaitingForBack = false;

        window.startPracticeSession = function() {
            let allPool = [];
            for (let qKey in questionsDB) {
                if (questionsDB[qKey]) {
                    allPool = allPool.concat(questionsDB[qKey]);
                }
            }

            if (allPool.length === 0) {
                allPool = [
                    { q: "ആധുനിക സാമ്പത്തികശാസ്ത്രത്തിന്റെ പിതാവ് ആര്?", options: ["എ) ആൽഫ്രഡ് മാർഷൽ", "ബി) ആഡം സ്മിത്ത്", "സി) ദാദാഭായി നൗറോജി", "ഡി) ലയണൽ റോബിൻസ്"], answer: 1, explanation: "ആഡം സ്മിത്ത് ആണ്." },
                    { q: "ഇന്ത്യൻ ഭരണഘടന പൗരന്മാർക്ക് ഉറപ്പുനൽകുന്ന സ്വാതന്ത്ര്യങ്ങൾ ഏതൊക്കെ?", options: ["എ) ചിന്തയ്ക്കുള്ള സ്വാതന്ത്ര്യം, ആശയപ്രകടനത്തിനുള്ള സ്വാതന്ത്ര്യം, വിശ്വാസത്തിനുള്ള സ്വാതന്ത്ര്യം, മതനിഷ്ഠയ്ക്കുള്ള സ്വാതന്ത്ര്യം, ആരാധനയ്ക്കുള്ള സ്വാതന്ത്ര്യം", "ബി) സഞ്ചാര സ്വാതന്ത്ര്യവും തൊഴിൽ സ്വാതന്ത്ര്യവും വാഗ്ദാന സ്വാതന്ത്ര്യവും", "സി) സ്വത്ത് സമ്പാദിക്കാനുള്ള സ്വാതന്ത്ര്യവും കച്ചവട സ്വാതന്ത്ര്യവും", "ഡി) രാഷ്ട്രീയ പ്രവർത്തനത്തിനുള്ള സ്വാതന്ത്ര്യവും സംഘടനാ സ്വാതന്ത്ര്യവും"], answer: 0, explanation: "ചിന്തയ്ക്കുള്ള സ്വാതന്ത്ര്യം, ആശയപ്രകടനത്തിനുള്ള സ്വാതന്ത്ര്യം, വിശ്വാസത്തിനുള്ള സ്വാതന്ത്ര്യം, മതനിഷ്ഠയ്ക്കുള്ള സ്വാതന്ത്ര്യം, ആരാധനയ്ക്കുള്ള സ്വാതന്ത്ര്യം" }
                ];
            }

            for (let i = allPool.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [allPool[i], allPool[j]] = [allPool[j], allPool[i]];
            }

            practiceQuestions = allPool.slice(0, 100);
            practiceIndex = 0;
            practiceDoneCount = 0;
            practiceLearnedCount = 0;
            practiceWrongList = [];
            isWaitingForBack = false;

            currentViewLevel = "practice";
            renderPracticeInterface();
        };

        function renderPracticeInterface() {
            document.getElementById('home-menu').style.display = 'none';
            let viewDiv = document.getElementById('dynamic-view');
            viewDiv.style.display = 'block';
            document.getElementById('view-title').innerText = "✍️ പ്രാക്ടീസ് ചെയ്യൂ (100 ചോദ്യങ്ങൾ)";

            if (practiceIndex >= practiceQuestions.length) {
                if (practiceWrongList.length > 0) {
                    practiceQuestions = [...practiceWrongList];
                    practiceWrongList = [];
                    practiceIndex = 0;
                } else {
                    renderPracticeResult();
                    return;
                }
            }

            let q = practiceQuestions[practiceIndex];
            let optionsHtml = '';
            q.options.forEach((opt, i) => {
                optionsHtml += `<div class="option-item" id="opt-item-${i}" onclick="checkPracticeAnswer(${i}, ${q.answer})">${opt}</div>`;
            });

            let container = document.getElementById('subtopics-container');
            container.innerHTML = `
                <div class="quiz-container">
                    <div class="quiz-top-bar">
                        <span>ചോദ്യം ${practiceIndex + 1} / ${practiceQuestions.length}</span>
                    </div>
                    <div class="question-text">${q.q}</div>
                    <div class="options-list" id="practice-options-box">${optionsHtml}</div>
                    <div id="learning-feedback-area"></div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.checkPracticeAnswer = function(selectedIdx, correctIdx) {
            let optBox = document.getElementById('practice-options-box');
            if (!optBox || isWaitingForBack) return;
            
            let items = optBox.getElementsByClassName('option-item');
            for(let item of items) { item.style.pointerEvents = 'none'; }

            practiceDoneCount++;

            if (selectedIdx === correctIdx) {
                document.getElementById(`opt-item-${selectedIdx}`).classList.add('blink-green-opt');
                practiceLearnedCount++;
                setTimeout(() => {
                    practiceIndex++;
                    renderPracticeInterface();
                }, 1000);
            } else {
                document.getElementById(`opt-item-${selectedIdx}`).classList.add('blink-red-opt');
                document.getElementById(`opt-item-${correctIdx}`).classList.add('blink-green-opt');
                playErrorSound();
                
                let q = practiceQuestions[practiceIndex];
                let correctOptText = q.options[q.answer];

                let feedbackArea = document.getElementById('learning-feedback-area');
                feedbackArea.innerHTML = `
                    <div class="learning-alert-box">
                        <p style="font-size: 0.9rem; font-weight: bold; color: #dc2626; margin-bottom: 6px;">⚠️ നമുക്ക് പഠിക്കാം ഒന്നുകൂടി ശ്രമിക്കാം</p>
                        <p style="font-size: 0.85rem; color: #1e293b; margin-bottom: 4px;"><strong>ശരിയായ ഉത്തരം:</strong> ${correctOptText}</p>
                        <p style="font-size: 0.8rem; color: #64748b;">വിശദീകരണം: ${q.explanation || 'ലഭ്യമല്ല'}</p>
                        <p style="font-size: 0.75rem; color: #047857; margin-top: 8px; font-weight: bold;">💡 ഇത് പഠിച്ച ശേഷം മുകളിലെ '← ബാക്ക്' ബട്ടൺ അമർത്തി അടുത്ത ചോദ്യത്തിലേക്ക് പോവുക.</p>
                    </div>
                `;

                practiceWrongList.push(q);
                isWaitingForBack = true;
            }
        };

        function renderPracticeResult() {
            document.getElementById('view-title').innerText = "📊 പ്രാക്ടീസ് റിസൾട്ട്";
            let container = document.getElementById('subtopics-container');
            container.innerHTML = `
                <div class="subtopic-card" style="background: #eff6ff; border-left: 5px solid #3b82f6; text-align: left; padding: 20px;">
                    <h3 style="color: #1e3a8a; margin-bottom: 12px;">🎉 പ്രാക്ടീസ് പൂർത്തിയായി!</h3>
                    <p style="font-size: 0.95rem; color: #334155; margin-bottom: 6px;">📝 ആകെ ചെയ്ത ചോദ്യങ്ങൾ: <strong>${practiceDoneCount}</strong></p>
                    <p style="font-size: 0.95rem; color: #166534; margin-bottom: 6px;">✅ പഠിച്ചവ / ശരിയാക്കിയവ: <strong>${practiceLearnedCount}</strong></p>
                </div>
                <button class="small-nav-btn" style="margin-top: 15px; width: 100%; justify-content: center;" onclick="goHome()">🏠 ഹോമിലേക്ക് പോവുക</button>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.goBack = function() {
            if (currentViewLevel === "practice") {
                if (isWaitingForBack) {
                    isWaitingForBack = false;
                    practiceIndex++;
                    renderPracticeInterface();
                } else {
                    renderPracticeResult();
                }
            } else if (currentViewLevel === "mock" || currentViewLevel === "flashcard") {
                openCategoryTopics(selectedModuleKey, selectedCatIndex);
            } else if (currentViewLevel === "topics") {
                loadModuleContent(selectedModuleKey, selectedModuleName);
            } else if (currentViewLevel === "categories") {
                openModulesListMenu();
            } else if (currentViewLevel === "modules_list") {
                goHome();
            } else {
                goHome();
            }
        };

        window.goHome = function() {
            currentViewLevel = "home";
            document.getElementById('dynamic-view').style.display = 'none';
            document.getElementById('home-menu').style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.onload = function() {
            goHome();
        };
    </script>

</body>
</html>
