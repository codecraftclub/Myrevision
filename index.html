    <!-- ഫയർബേസ് SDKs & ക്ലൗഡ് സിങ്ക് മാനേജർ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDA1XwfYzlPCL_Soxia0d-JpNekGGCaJMM",
            authDomain: "mypscrevison.firebaseapp.com",
            projectId: "mypscrevison",
            storageBucket: "mypscrevison.firebasestorage.app",
            messagingSenderId: "89979950079",
            appId: "1:89979950079:web:707815264541bba457cdca",
            measurementId: "G-GC849S4G0N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveToFirebase = async function(customName, itemsArray, collectionName = "revision_sets") {
            try {
                await addDoc(collection(db, collectionName), {
                    name: customName,
                    items: itemsArray,
                    createdAt: new Date().toISOString()
                });
                alert(`✓ "${customName}" ഫയർബേസിൽ വിജയകരമായി സേവ് ചെയ്തു!`);
            } catch (e) {
                console.error("Firebase Error: ", e);
                alert("ഫയർബേസിൽ സേവ് ചെയ്യുന്നതിൽ പരാജയപ്പെട്ടു.");
            }
        };

        window.loadFromFirebase = async function(collectionName = "revision_sets") {
            try {
                let querySnapshot = await getDocs(collection(db, collectionName));
                let sets = [];
                querySnapshot.forEach((document) => {
                    sets.push({ id: document.id, ...document.data() });
                });
                return sets;
            } catch (e) { return []; }
        };

        window.deleteFromFirebaseDoc = async function(docId, collectionName = "revision_sets") {
            try {
                await deleteDoc(doc(db, collectionName, docId));
                alert("സെറ്റ് വിജയകരമായി ഡിലീറ്റ് ചെയ്തു!");
            } catch (e) {
                console.error("Firebase Delete Error: ", e);
                alert("ഡിലീറ്റ് ചെയ്യുന്നതിൽ പരാജയപ്പെട്ടു.");
            }
        };

        window.saveUserProgressToCloud = async function(key, dataObj) {
            try {
                await setDoc(doc(db, "user_progress", key), {
                    data: dataObj,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            } catch (e) { console.error("Cloud Sync Error:", e); }
        };

        window.loadUserProgressFromCloud = async function(key) {
            try {
                let docSnap = await getDoc(doc(db, "user_progress", key));
                if (docSnap.exists()) return docSnap.data().data || null;
                return null;
            } catch (e) { return null; }
        };

        window.loadRevisionCountsFromFirebase = async function() {
            return await window.loadUserProgressFromCloud("revision_counts") || {};
        };
        window.saveRevisionCountsToFirebase = async function(counts) {
            await window.saveUserProgressToCloud("revision_counts", counts);
        };
        window.loadMockCountsFromFirebase = async function() {
            return await window.loadUserProgressFromCloud("mock_counts") || {};
        };
        window.saveMockCountsToFirebase = async function(counts) {
            await window.saveUserProgressToCloud("mock_counts", counts);
        };
    </script>

        function getRevisionStatus(topicId) {
            let mockDateStr = localStorage.getItem(`rev_date_mock_${topicId}`);
            let flashDateStr = localStorage.getItem(`rev_date_flash_${topicId}`);
            let dates = [];
            if (mockDateStr) dates.push(new Date(mockDateStr));
            if (flashDateStr) dates.push(new Date(flashDateStr));

            if (dates.length === 0) return 'new';

            let lastDate = new Date(Math.max(...dates));
            let today = new Date();
            let diffDays = Math.floor((today - lastDate) / (1000 * 60 * 60 * 24));

            let intervals = [1, 3, 7, 14, 30];
            let targetDay = null;

            for (let interval of intervals) {
                if (diffDays <= interval) {
                    targetDay = interval;
                    break;
                }
            }

            if (targetDay === null) return 'overdue';

            if (diffDays === targetDay) return 'today'; 
            if (diffDays === targetDay - 1) return 'tomorrow'; 
            if (diffDays > targetDay) return 'overdue'; 

            return 'safe';
        }

        function getModuleNotificationClass(modKey) {
            let topics = moduleData[modKey];
            let hasRed = false;
            let hasOrange = false;
            let hasYellow = false;
            let hasTopics = false;

            topics.forEach(cat => {
                cat.topics.forEach(t => {
                    hasTopics = true;
                    let status = getRevisionStatus(t.id);
                    if (status === 'overdue') hasRed = true;
                    if (status === 'today') hasOrange = true;
                    if (status === 'tomorrow') hasYellow = true;
                });
            });

            if (!hasTopics) return '';
            if (hasRed) return 'blink-red';
            if (hasOrange) return 'blink-orange';
            if (hasYellow) return 'blink-yellow';
            return '';
        }

        window.openRevisionSetup = function() {

            optionsHtml += `<optgroup label="എല്ലാ മോഡ്യൂളുകളും (Master Test)">`;
            optionsHtml += `<option value="all_modules_master">🌟 എല്ലാ മോഡ്യൂളുകളിൽ നിന്നും റാൻഡം ചോദ്യങ്ങൾ</option>`;

                <button class="small-nav-btn" style="margin-bottom: 12px;" onclick="openMyRevisionMenu()">← തിരികെ</button>

                    <select id="custom-rev-select" class="form-control">${optionsHtml}</select>
                </div>
                <div class="form-group">
                    <label>ചോദ്യങ്ങളുടെ എണ്ണം തിരഞ്ഞെടുക്കുക:</label>
                    <select id="custom-rev-count" class="form-control">
                        <option value="10">10 ചോദ്യങ്ങൾ</option>
                        <option value="20">20 ചോദ്യങ്ങൾ</option>
                        <option value="30">30 ചോദ്യങ്ങൾ</option>
                        <option value="50">50 ചോദ്യങ്ങൾ</option>
                        <option value="75">75 ചോദ്യങ്ങൾ</option>
                        <option value="100">100 ചോദ്യങ്ങൾ</option>
                    </select>
                </div>
                <button class="result-action-btn btn-retry" onclick="startSelectedCustomTest()">ടെസ്റ്റ് ആരംഭിക്കുക</button>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.startSelectedCustomTest = function() {
            let selectElem = document.getElementById('custom-rev-select');
            let countElem = document.getElementById('custom-rev-count');
            if (!selectElem || !selectElem.value) {
                alert("ദയവായി ഏതെങ്കിലും ഒരു വിഷയം അല്ലെങ്കിൽ മോഡ്യൂൾ തിരഞ്ഞെടുക്കുക!");
                return;
            }

            let val = selectElem.value;
            let targetCount = parseInt(countElem.value);
            let pool = [];
            let customName = "കസ്റ്റം റിവിഷൻ ടെസ്റ്റ്";

            if (val === "all_modules_master") {
                for (let mKey in moduleData) {
                    moduleData[mKey].forEach(cat => {
                        cat.topics.forEach(t => {
                            if (questionsDB[t.id]) {
                                pool = pool.concat(questionsDB[t.id]);
                            }
                        });
                    });
                }
                customName = "എല്ലാ മോഡ്യൂളുകളും (Master Test)";
            } else if (val.startsWith("sub_")) {
                let subId = val.replace("sub_", "");
                pool = questionsDB[subId] || [];
                for (let mKey in moduleData) {
                    moduleData[mKey].forEach(cat => {
                        cat.topics.forEach(t => {
                            if (t.id === subId) customName = t.title;
                        });
                    });
                }
            } else if (val.startsWith("mod_full_")) {
                let modKey = val.replace("mod_full_", "");
                let cats = moduleData[modKey] || [];
                cats.forEach(cat => {
                    cat.topics.forEach(t => {
                        if (questionsDB[t.id]) {
                            pool = pool.concat(questionsDB[t.id]);
                        }
                    });
                });
                customName = `${modKey.replace("mod_", "MODULE ")} മുഴുവൻ ടെസ്റ്റ്`;
            }

            if (pool.length === 0) {
                alert("ഈ വിഭാഗത്തിൽ ചോദ്യങ്ങൾ ഒന്നും ലഭ്യമല്ല!");
                return;
            }

            if (pool.length < targetCount) {
                let confirmProceed = confirm(`ഈ വിഭാഗത്തിൽ ${targetCount} ചോദ്യങ്ങൾ ലഭ്യമല്ല. ലഭ്യമായ ${pool.length} ചോദ്യങ്ങൾ വെച്ച് എക്സാം എഴുതണോ?`);
                if (!confirmProceed) return;
                targetCount = pool.length;
            }

            for (let i = pool.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            let finalQuestions = pool.slice(0, targetCount);

            currentViewLevel = "mock";
            startQuiz(finalQuestions, customName);
        };

        window.goBack = function() {
            if (quizTimerInterval) clearInterval(quizTimerInterval);
            if (currentViewLevel === "topics") loadModuleContent(selectedModuleKey, selectedModuleName);
            else if (currentViewLevel === "flashcard" || currentViewLevel === "mock") openCategoryTopics(selectedModuleKey, selectedCatIndex);
            else if (currentViewLevel === "modules_list") goHome();
            else goHome();
        };

        window.goHome = function() {
            if (quizTimerInterval) clearInterval(quizTimerInterval);
            currentViewLevel = "home";
            document.getElementById('dynamic-view').style.display = 'none';
            document.getElementById('home-menu').style.display = 'flex';
            
            let homeBox = document.getElementById('home-modules-box');
            if(homeBox) homeBox.style.display = 'flex';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.openSpecificMock = function(subId, title) {
            selectedSubtopicId = subId;
            selectedSubtopicTitle = title;
            currentViewLevel = "mock";
            let qList = questionsDB[subId] || [];
            if (qList.length === 0) {
                alert('ഈ ടോപ്പിക്കിൽ ചോദ്യങ്ങൾ ഉടൻ ചേർക്കുന്നതാണ്.');
                return;
            }
            let shuffledList = JSON.parse(JSON.stringify(qList));
            for (let i = shuffledList.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [shuffledList[i], shuffledList[j]] = [shuffledList[j], shuffledList[i]];
            }
            startQuiz(shuffledList, title);
        };

        let flashCardsList = [];
        let flashIdx = 0;
        let unknownFlashCards = [];

        window.openFlashcardSession = function(subId, title) {
            selectedSubtopicId = subId;
            selectedSubtopicTitle = title;
            currentViewLevel = "flashcard";
            let fList = flashcardDB[subId] || [];
            if (fList.length === 0) {
                let qList = questionsDB[subId] || [];
                if (qList.length === 0) {
                    alert('ഈ ടോപ്പിക്കിൽ ഫ്ലാഷ് കാർഡുകൾ ലഭ്യമല്ല.');
                    return;
                }
                fList = qList.map(q => ({ front: q.q, back: q.options[q.answer] }));
            }
            flashCardsList = fList;
            flashIdx = 0;
            unknownFlashCards = [];
            renderFlashcard();
        };

        function renderFlashcard() {
            document.getElementById('home-menu').style.display = 'none';
            let viewDiv = document.getElementById('dynamic-view');
            viewDiv.style.display = 'block';
            
            document.getElementById('view-title').innerText = `⚡ ${selectedSubtopicTitle} (ഫ്ലാഷ് കാർഡ് ${flashIdx + 1}/${flashCardsList.length})`;
            let container = document.getElementById('subtopics-container');
            let card = flashCardsList[flashIdx];

            container.innerHTML = `
                <div class="flashcard-container">
                    <div class="flash-card-scene" onclick="document.getElementById('fcard-inner').classList.toggle('flipped')">
                        <div class="flash-card-box" id="fcard-inner">
                            <div class="flash-card-face flash-card-front">
                                <span style="font-size: 0.75rem; color: #64748b; font-weight: bold; margin-bottom: 8px;">ചോദ്യം</span>
                                <div style="font-size: 1.05rem; font-weight: bold;">${card.front}</div>
                            </div>
                            <div class="flash-card-face flash-card-back">
                                <span style="font-size: 0.75rem; color: #166534; font-weight: bold; margin-bottom: 8px;">ഉത്തരം</span>

                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.markFlashCard = function(isKnown) {
            if (!isKnown) {
                unknownFlashCards.push(flashCardsList[flashIdx]);
            }
            flashIdx++;
            if (flashIdx < flashCardsList.length) {
                renderFlashcard();
            } else {
                if(selectedSubtopicId) {
                    localStorage.setItem(`rev_date_flash_${selectedSubtopicId}`, new Date().toISOString());
                }
                
                if (unknownFlashCards.length > 0) {
                    let confirmSave = confirm(`ഫ്ലാഷ് കാർഡ് പരിശീലനം പൂർത്തിയായി!\nഓർമ്മയില്ലാത്ത / തെറ്റിയ ${unknownFlashCards.length} കാർഡുകൾ ചേർത്ത് പുതിയ റിവിഷൻ സെറ്റ് ഫയർബേസിൽ സേവ് ചെയ്യണോ?`);
                    if (confirmSave) {
                        let setName = prompt("പുതിയ റിവിഷൻ സെറ്റിന്റെ പേര് നൽകുക:", `ഫ്ലാഷ് കാർഡ് സെറ്റ് - ${selectedSubtopicTitle}`);
                        if (setName && window.saveToFirebase) {
                            window.saveToFirebase(setName.trim(), unknownFlashCards, "flashcard_revision_sets");
                        }
                    }
                } else {
                    alert("അഭിനന്ദനങ്ങൾ! എല്ലാ ഫ്ലാഷ് കാർഡുകളും നിങ്ങൾക്കറിയാമായിരുന്നു.");
                }
                goHome();
            }
        };

        let qIndex = 0;
        let quizQuestions = [];
        let userAnswers = {};
        let bookmarked = {};
        let quizTimerInterval = null;
        let timeLeftSeconds = 0;

        function startQuiz(qArray, customTitle = null) {
            quizQuestions = qArray;
            if (customTitle) selectedSubtopicTitle = customTitle;
            qIndex = 0;
            userAnswers = {};
            bookmarked = {};
            
            if (quizTimerInterval) clearInterval(quizTimerInterval);
            timeLeftSeconds = quizQuestions.length * 50;
            
            quizTimerInterval = setInterval(() => {
                if (timeLeftSeconds > 0) {
                    timeLeftSeconds--;
                    let timerElem = document.getElementById('quiz-timer-span');
                    if (timerElem) {
                        let m = Math.floor(timeLeftSeconds / 60);
                        let s = timeLeftSeconds % 60;
                        timerElem.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    }
                } else {
                    clearInterval(quizTimerInterval);
                    alert("സമയം അവസാനിച്ചിരിക്കുന്നു!");
                    finishQuizSession();
                }
            }, 1000);

            renderQuizInterface();
        }

        function renderQuizInterface() {
            document.getElementById('home-menu').style.display = 'none';
            let viewDiv = document.getElementById('dynamic-view');
            viewDiv.style.display = 'block';
            document.getElementById('view-title').innerText = `📝 മോക്ക് ടെസ്റ്റ്: ${selectedSubtopicTitle || 'Custom'}`;
            
            let q = quizQuestions[qIndex];
            let isMarked = bookmarked[qIndex] ? 'active' : '';
            let selectedOpt = userAnswers[qIndex];

            if (!q.shuffledOptions) {
                let optionsWithIndex = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
                for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
                }
                q.shuffledOptions = optionsWithIndex;
                q.shuffledAnswer = optionsWithIndex.findIndex(item => item.originalIndex === q.answer);
            }

            let m = Math.floor(timeLeftSeconds / 60);
            let s = timeLeftSeconds % 60;
            let timeStr = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

            let letters = ['എ)', 'ബി)', 'സി)', 'ഡി)'];
            let optionsHtml = '';
            q.shuffledOptions.forEach((item, i) => {
                let selClass = selectedOpt === i ? 'selected' : '';
                optionsHtml += `<div class="option-item ${selClass}" onclick="selectAns(${i})">${letters[i]} ${item.text}</div>`;
            });

            let paletteHtml = '';
            quizQuestions.forEach((item, idx) => {
                let statusClass = "";
                if (userAnswers[idx] !== undefined) statusClass = "attempted";
                if (bookmarked[idx]) statusClass += " bookmarked";
                if (idx === qIndex) statusClass += " current";
                paletteHtml += `<button class="palette-btn ${statusClass}" onclick="jumpToQ(${idx})">${idx + 1}</button>`;
            });

            let container = document.getElementById('subtopics-container');
            container.innerHTML = `
                <div class="quiz-container" id="quiz-swipe-area">
                    <div class="quiz-top-bar">
                        <span>ചോദ്യം ${qIndex + 1} / ${quizQuestions.length}</span>
                        <div class="timer-display">⏳ <span id="quiz-timer-span">${timeStr}</span></div>
                        <button class="bookmark-btn ${isMarked}" onclick="toggleBookmark()">⭐ ബുക്ക്മാർക്ക്</button>
                    </div>
                    <div class="question-text">${q.q}</div>
                    <div class="options-list">${optionsHtml}</div>
                    <p style="font-size: 0.75rem; color: #64748b; text-align: center; margin-bottom: 10px;">👉 സ്വൈപ്പ് (Swipe) ചെയ്യുക അല്ലെങ്കിൽ താഴെയുള്ള പാലറ്റ് ഉപയോഗിക്കുക</p>
                    
                    <button class="result-action-btn btn-retry" style="margin-top: 5px;" onclick="confirmFinishQuiz()">ടെസ്റ്റ് ഫിനിഷ് ചെയ്യുക</button>

                    <div style="margin-top: 15px; font-size: 0.8rem; font-weight: bold; color: #334155;">ക്വസ്റ്റ്യൻ പാലറ്റ്:</div>
                    <div class="palette-grid">${paletteHtml}</div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setupSwipeGestures();
        }

        window.selectAns = function(optIdx) {
            userAnswers[qIndex] = optIdx;
            
            // ഓപ്ഷൻ ക്ലിക്ക് ചെയ്യുമ്പോൾ അടുത്ത ചോദ്യത്തിലേക്ക് പോകും.
            // എന്നാൽ ഇത് അവസാന ചോദ്യമാണെങ്കിൽ ഓട്ടോമാറ്റിക്കായി സബ്മിറ്റ് ആകില്ല.
            setTimeout(() => {
                if (qIndex < quizQuestions.length - 1) {
                    qIndex++;
                    renderQuizInterface();
                } else {
                    // എല്ലാ ചോദ്യങ്ങളും അറ്റൻഡ് ചെയ്തു കഴിഞ്ഞു അവസാന ചോദ്യത്തിൽ എത്തുമ്പോൾ മാത്രം ചോദിക്കും
                    let allAnswered = quizQuestions.every((_, idx) => userAnswers[idx] !== undefined);
                    if (allAnswered) {
                        let confirmAuto = confirm("എല്ലാ ചോദ്യങ്ങളും പൂർത്തിയായിരിക്കുന്നു! ടെസ്റ്റ് സബ്മിറ്റ് ചെയ്യട്ടെയോ?");
                        if (confirmAuto) {
                            finishQuizSession();
                        }
                    }
                }
            }, 300);
        }

        window.toggleBookmark = function() {
            bookmarked[qIndex] = !bookmarked[qIndex];
            renderQuizInterface();
        }

        window.jumpToQ = function(idx) {
            qIndex = idx;
            renderQuizInterface();
        }

        function setupSwipeGestures() {
            let touchStartX = 0;
            let touchEndX = 0;
            let area = document.getElementById('quiz-swipe-area');
            if(!area) return;

            area.ontouchstart = e => { touchStartX = e.changedTouches[0].screenX; };
            area.ontouchend = e => { 
                touchEndX = e.changedTouches[0].screenX; 
                let threshold = 50;
                if (touchEndX + threshold < touchStartX) {
                    if (qIndex < quizQuestions.length - 1) { qIndex++; renderQuizInterface(); }
                } else if (touchEndX > touchStartX + threshold) {
                    if (qIndex > 0) { qIndex--; renderQuizInterface(); }
                }
            };
        }

        window.confirmFinishQuiz = function() {
            let confirmSub = confirm("ടെസ്റ്റ് സബ്മിറ്റ് ചെയ്യണം എന്ന് ഉറപ്പാണോ?");
            if (confirmSub) {
                finishQuizSession();
            }
        };

        window.finishQuizSession = async function() {
            if (quizTimerInterval) clearInterval(quizTimerInterval);
            
            let correctCount = 0;
            let wrongCount = 0;
            quizQuestions.forEach((q, idx) => {
                let userAns = userAnswers[idx];
                if (userAns !== undefined) {
                    if (userAns === q.shuffledAnswer) correctCount++;
                    else {
                        wrongCount++;
                        try {
                            let mistakes = JSON.parse(localStorage.getItem('frequent_mistakes') || '{}');
                            mistakes[q.q] = (mistakes[q.q] || 0) + 1;
                            localStorage.setItem('frequent_mistakes', JSON.stringify(mistakes));
                        } catch(e) {}
                    }
                }
            });
            let totalScore = Math.max(0, (correctCount * 1.0) - (wrongCount * 0.33)).toFixed(2);

            if (selectedSubtopicId) {
                try {
                    localStorage.setItem(`rev_date_mock_${selectedSubtopicId}`, new Date().toISOString());
                    
                    let attemptsKey = `mock_attempts_${selectedSubtopicId}`;
                    let attempts = JSON.parse(localStorage.getItem(attemptsKey) || '[]');
                    attempts.push({ date: new Date().toLocaleDateString(), score: totalScore });
                    localStorage.setItem(attemptsKey, JSON.stringify(attempts));
                    
                    let mockCounts = await window.loadMockCountsFromFirebase();
                    if(!mockCounts || Object.keys(mockCounts).length === 0) {
                        mockCounts = JSON.parse(localStorage.getItem('psc_mock_counts') || '{}');
                    }
                    mockCounts[selectedSubtopicId] = (mockCounts[selectedSubtopicId] || 0) + 1;
                    localStorage.setItem('psc_mock_counts', JSON.stringify(mockCounts));
                    if (window.saveMockCountsToFirebase) {
                        await window.saveMockCountsToFirebase(mockCounts);
                    }
                } catch(err) {
                    console.error("Storage Error: ", err);
                }
            }
            renderResultView('all');
        }

        function renderResultView(filterType) {

        { q: "സമ്പത്തിന്റെ സൃഷ്ടിയും സമാഹരണവും എന്ന ആശയം ഊന്നിയുള്ള നിർവചനം നൽകിയത് ആര്?", options: ["എ) ആഡം സ്മിത്ത്", "ബി) ആൽഫ്രഡ് മാർഷ്യൽ", "സി) ലയണൽ റോബിൻസ്", "ഡി) പോൾ എ. സാമുവൽസൺ"], answer: 0, explanation: "ആഡം സ്മിത്ത് ആണ്." },
        { q: "'ക്ഷേമ നിർവചനം' (Welfare Definition) സാമ്പത്തിക ശാസ്ത്രത്തിൽ അവതരിപ്പിച്ചത് ആര്?", options: ["എ) ആഡം സ്മിത്ത്", "ബി) ആൽഫ്രഡ് മാർഷ്യൽ", "സി) ലയണൽ റോബിൻസ്", "ഡി) പോൾ എ. സാമുവൽസൺ"], answer: 1, explanation: "ആൽഫ്രഡ് മാർഷ്യൽ ആണ് ക്ഷേമ നിർവചനം അവതരിപ്പിച്ചത്." },
        { q: "ആൽഫ്രഡ് മാർഷ്യൽ രചിച്ച ഗ്രന്ഥം ഏത്?", options: ["എ) വെൽത്ത് ഓഫ് നേഷൻസ്", "ബി) പ്രിൻസിപ്പൽസ് ഓഫ് ഇക്കണോമിക്സ്", "സി) ആന്റ് എസ്സേ ഓൺ ദി നേച്ചർ", "ഡി) പോവർട്ടി ആന്റ് അൺ-ബ്രിട്ടീഷ് റൂൾ"], answer: 1, explanation: "പ്രിൻസിപ്പൽസ് ഓഫ് ഇക്കണോമിക്സ് ആണ് അദ്ദേഹത്തിന്റെ ഗ്രന്ഥം." },
        { q: "ആൽഫ്രഡ് മാർഷ്യലിന്റെ 'പ്രിൻസിപ്പൽസ് ഓഫ് ഇക്കണോമിക്സ്' പ്രസിദ്ധീകരിച്ച വർഷം ഏത്?", options: ["എ) 1776", "ബി) 1890", "സി) 1932", "ഡി) 1947"], answer: 1, explanation: "1890-ൽ ആണ് പ്രസിദ്ധീകരിച്ചത്." },
        { q: "മനുഷ്യ ക്ഷേമമാണ് സാമ്പത്തികശാസ്ത്രത്തിന്റെ ലക്ഷ്യം എന്ന് വാദിച്ച ശാസ്ത്രജ്ഞൻ ആര്?", options: ["എ) ആഡം സ്മിത്ത്", "ബി) ആൽഫ്രഡ് മാർഷ്യൽ", "സി) ലയണൽ റോബിൻസ്", "ഡി) പോൾ എ. സാമുവൽസൺ"], answer: 1, explanation: "ആൽഫ്രഡ് മാർഷ്യൽ ആണ്." },
        { q: "'ദൗർലഭ്യ നിർവചനം' (Scarcity Definition) നൽകിയത് ആര്?", options: ["എ) ആഡം സ്മിത്ത്", "ബി) ആൽഫ്രഡ് മാർഷ്യൽ", "സി) ലയണൽ റോബിൻസ്", "ഡി) പോൾ എ. സാമുവൽസൺ"], answer: 2, explanation: "ലയണൽ റോബിൻസ് ആണ് ദൗർലഭ്യ നിർവചനം നൽകിയത്." },
        { q: "ലയണൽ റോബിൻസിന്റെ സാമ്പത്തികശാസ്ത്ര ഗ്രന്ഥം ഏത്?", options: ["എ) പ്രിൻസിപ്പൽസ് ഓഫ് ഇക്കണോമിക്സ്", "ബി) ആന്റ് എസ്സേ ഓൺ ദി നേച്ചർ ആന്റ് സിഗ്നിഫിക്കൻസ് ഓഫ് ഇക്കണോമിക് സയൻസ്", "സി) വെൽത്ത് ഓഫ് നേഷൻസ്", "ഡി) പോവർട്ടി ആന്റ് അൺ-ബ്രിട്ടീഷ് റൂൾ"], answer: 1, explanation: "ആന്റ് എസ്സേ ഓൺ ദി നേച്ചർ ആന്റ് സിഗ്നിഫിക്കൻസ് ഓഫ് ഇക്കണോമിക് സയൻസ്." },
        { q: "ലയണൽ റോബിൻസിന്റെ ഗ്രന്ഥം പ്രസിദ്ധീകരിച്ച വർഷം ഏത്?", options: ["എ) 1776", "ബി) 1890", "സി) 1932", "ഡി) 1950"], answer: 2, explanation: "1932-ൽ ആണ് ഇത് പ്രസിദ്ധീകരിച്ചത്." },
        { q: "'സാമ്പത്തിക വളർച്ചാ നിർവചനം' (Growth Definition) നൽകിയ സാമ്പത്തിക ശാസ്ത്രജ്ഞൻ ആര്?", options: ["എ) ആഡം സ്മിത്ത്", "ബി) ആൽഫ്രഡ് മാർഷ്യൽ", "സി) ലയണൽ റോബിൻസ്", "ഡി) പോൾ എ. സാമുവൽസൺ"], answer: 3, explanation: "പോൾ എ. സാമുവൽസൺ ആണ്." },
        { q: "സമൂഹം വിഭവങ്ങളെ എങ്ങനെ വിനിയോഗിക്കുന്നു എന്നത് പഠിക്കുന്ന ശാസ്ത്രമാണ് സാമ്പത്തികശാസ്ത്രം എന്ന് അഭിപ്രായപ്പെട്ടത് ആര്?", options: ["എ) ആഡം സ്മിത്ത്", "ബി) ആൽഫ്രഡ് മാർഷ്യൽ", "സി) ലയണൽ റോബിൻസ്", "ഡി) പോൾ എ. സാമുവൽസൺ"], answer: 3, explanation: "പോൾ എ. സാമുവൽസൺ ആണ്." },
        { q: "മനുഷ്യരുടെ ആവശ്യങ്ങളും വിഭവങ്ങളും തമ്മിലുള്ള ബന്ധം പഠിക്കുന്ന ശാസ്ത്രം ഏത്?", options: ["എ) ഭൗതികശാസ്ത്രം", "ബി) സാമ്പത്തികശാസ്ത്രം", "സി) രസതന്ത്രം", "ഡി) ചരിത്രം"], answer: 1, explanation: "സാമ്പത്തികശാസ്ത്രം." }
    ],
    "mod_4_sub_2": [
        { 
            q: "സമ്പത്ത് ഉൽപ്പാദിപ്പിക്കുന്നതിനും വിതരണം ചെയ്യുന്നതിനും ഉപയോഗിക്കുന്നതിനായി സമൂഹം വിഭവങ്ങളെ എങ്ങനെ വിനിയോഗിക്കുന്നു എന്നത് പഠിക്കുന്ന ശാസ്ത്രമാണ് സാമ്പത്തികശാസ്ത്രം എന്ന് നിർവചിച്ചത് ആര്?", 
            options: ["എ. ആദം സ്മിത്ത്", "ബി. പോൾ എ. സാമുവൽസൺ", "സി. കാറൽ മാർക്സ്", "ഡി. ഡേവിഡ് റിക്കാർഡോ"], 
            answer: 1, 
            explanation: "പോൾ എ. സാമുവൽസണിന്റെ വളർച്ചാ നിർവചനപ്രകാരമാണ് സാമ്പത്തികശാസ്ത്രത്തെ സമൂഹം വിഭവങ്ങൾ വിനിയോഗിക്കുന്നത് പഠിക്കുന്ന ശാസ്ത്രമായി നിർവചിച്ചിട്ടുള്ളത്." 
        },
        { 
            q: "സാമ്പത്തിക പ്രവർത്തനങ്ങളുമായി ബന്ധപ്പെട്ട് താഴെ നൽകിയിരിക്കുന്ന പ്രസ്താവനകൾ പരിശോധിക്കുക:\n1. ആവശ്യമായ വസ്തുക്കളും സേവനങ്ങളും സൃഷ്ടിക്കുന്ന പ്രവർത്തനമാണ് ഉൽപ്പാദനം.\n2. ഉൽപ്പാദന പ്രവർത്തനങ്ങൾ, വിതരണം, വിനിയോഗം എന്നിവ സാമ്പത്തിക പ്രവർത്തനങ്ങളുടെ മൂന്നു വിഭാഗങ്ങളിൽപ്പെടുന്നു.\n3. മനുഷ്യന്റെ ശാരീരികവും മാനസികവുമായ കഴിവുകൾ ഉപയോഗിക്കുന്ന പരിശ്രമങ്ങളെയാണ് മൂലധനം എന്ന് വിളിക്കുന്നത്.\nഇതിൽ ശരിയായ പ്രസ്താവനകൾ ഏവ?", 
            options: ["എ. 1 ഉം 2 ഉം മാത്രം", "ബി. 2 ഉം 3 ഉം മാത്രം", "സി. 1 ഉം 3 ഉം മാത്രം", "ഡി. 1, 2, 3 എന്നിവയെല്ലാം"], 
            answer: 0, 
            explanation: "മനുഷ്യന്റെ ശാരീരികവും മാനസികവുമായ കഴിവുകൾ ഉപയോഗിക്കുന്ന പരിശ്രമങ്ങളെ 'തൊഴിൽ' (Labour) എന്നാണ് വിളിക്കുന്നത്. അതിനാൽ മൂന്നാമത്തെ പ്രസ്താവന തെറ്റാണ്. 1, 2 പ്രസ്താവനകൾ ശരിയാണ്." 
        },
        { 
            q: "ഉൽപ്പാദന ഘടകങ്ങളെ അവയുടെ പ്രതിഫലങ്ങളുമായി ചേരുപടി ചേർക്കുക:\na. ഭൂമി - വാടക\nb. തൊഴിൽ - കൂലി / വേതനം\nc. മൂലധനം - പലിശ\nd. സംരംഭകൻ - ലാഭം\nശരിയായ കോഡ് തിരഞ്ഞെടുക്കുക:", 
            options: ["എ. a-2, b-3, c-4, d-1", "ബി. a-1, b-2, c-3, d-4", "സി. a-3, b-1, c-2, d-4", "ഡി. a-2, b-4, c-3, d-1"], 
            answer: 0, 
            explanation: "ഭൂമിയുടെ പ്രതിഫലം വാടകയും (Rent), തൊഴിലിന്റെ പ്രതിഫലം കൂലി/വേതനവും (Wages), മൂലധനത്തിന്റെ പ്രതിഫലം പലിശയും (Interest), സംരംഭകന്റെ പ്രതിഫലം ലാഭവുമാണ് (Profit)." 
        },
        { 
            q: "ഉൽപ്പാദന ഘടകങ്ങളും അവയുടെ സ്വഭാവവുമായി ബന്ധപ്പെട്ട് താഴെ നൽകിയിരിക്കുന്നവയിൽ ശരിയായ ജോഡി ഏത്?", 
            options: ["എ. ഭൂമി - സജീവ ഘടകം (Active Factor)", "ബി. മൂലധനം - സജീവ ഘടകം (Active Factor)", "സി. സംരംഭകൻ - സജീവ ഘടകം (Active Factor)", "ഡി. തൊഴിൽ - നിഷ്ക്രിയ ഘടകം (Passive Factor)"], 
            answer: 2, 
            explanation: "ഭൂമിയും മൂലധനവും നിഷ്ക്രിയ ഘടകങ്ങളും (Passive Factors), തൊഴിലും സംരംഭകനും സജീവ ഘടകങ്ങളുമാണ് (Active Factors). അതുകൊണ്ട് 'സംരംഭകൻ - സജീവ ഘടകം' എന്നത് ശരിയായ ജോഡിയാണ്." 
        },
        { 
            q: "സാമ്പത്തികശാസ്ത്ര സിദ്ധാന്തങ്ങളും അവ ആവിഷ്കരിച്ചവരുമായി ബന്ധപ്പെട്ട സിദ്ധാന്തങ്ങൾ രൂപംകൊണ്ട ശരിയായ ക്രമം കണ്ടെത്തുക:\n1. റെന്റ് തിയറി (Rent Theory)\n2. സർപ്ലസ് വാല്യൂ തിയറി (Surplus Value Theory)\n3. ഇന്നൊവേഷൻ തിയറി ഓഫ് പ്രോഫിറ്റ് (Innovation Theory of Profit)", 
            options: ["എ. 1, 2, 3", "ബി. 2, 1, 3", "സി. 3, 1, 2", "ഡി. 1, 3, 2"], 
            answer: 0, 
            explanation: "ഡേവിഡ് റിക്കാർഡോയുടെ റെന്റ് തിയറി, കാറൽ മാർക്സിന്റെ സർപ്ലസ് വാല്യൂ തിയറി, ജോസഫ് ഷുംപീറ്ററുടെ ഇന്നൊവേഷൻ തിയറി എന്നീ ക്രമത്തിലാണ് ഇവ നൽകപ്പെട്ടിട്ടുള്ളത്." 
        },
