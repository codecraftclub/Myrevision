<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>പ്രാക്ടീസ് ചെയ്യൂ പഠിക്കൂ - LDC PSC Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .small-nav-btn {
            background-color: #e2e8f0;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: #334155;
            margin-bottom: 15px;
            margin-right: 5px;
        }
        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            color: #333;
            width: 100%;
            margin-bottom: 10px;
        }
        .notification-card {
            background-color: #fff1f2;
            border: 3px solid #e11d48;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }
        .notification-card.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container" id="practice-container">
        <div>
            <button class="small-nav-btn" onclick="goBackToPrevious()">← പുറകോട്ട്</button>
            <button class="small-nav-btn" onclick="goBackToHome()">🏠 ഹോം</button>
        </div>
        <h2 style="color: #1e293b; margin-top: 0; margin-bottom: 15px; font-size: 1.2rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;">📖 പ്രാക്ടീസ് ചെയ്യൂ പഠിക്കൂ</h2>
        
        <div style="display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px;">
            <span style="font-size: 0.9rem; font-weight: bold; color: #334155;" id="pool-count">ബാക്കിയുള്ള ചോദ്യങ്ങൾ: 0</span>
            <button onclick="finishTest()" style="background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold;">അവസാനിപ്പിക്കുക</button>
        </div>

        <div id="question-text" style="font-size: 1rem; color: #1e293b; font-weight: 600; margin-bottom: 15px; line-height: 1.5;">ലോഡ് ചെയ്യുന്നു...</div>
        <div id="options-container" style="display: flex; flex-direction: column; gap: 10px;"></div>

        <!-- ഉത്തരം തെറ്റുമ്പോൾ കാണുന്ന നോട്ടിഫിക്കേഷൻ ബോക്സ് -->
        <div class="notification-card" id="error-notification">
            <h3 style="color: #e11d48; margin-top: 0; margin-bottom: 10px; font-size: 1.1rem;">❌ ഉത്തരം തെറ്റാണ്!</h3>
            <p style="font-size: 1rem; color: #0f172a; margin-bottom: 8px; font-weight: bold;" id="notif-correct">ശരിയായ ഉത്തരം: </p>
            <p style="font-size: 0.9rem; color: #334155; margin-bottom: 18px; line-height: 1.4;" id="notif-explanation">വിശദീകരണം...</p>
            <button onclick="proceedAfterError()" style="background-color: #2563eb; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: bold; color: white; cursor: pointer; width: 100%;">അടുത്ത ചോദ്യം →</button>
        </div>
    </div>

    <script src="questions.js"></script>
    <script>
        let practicePool = [];
        let practiceIndex = 0;
        let totalAttemptsCount = 0;
        let masteredCount = 0;
        let questionDisplayNumber = 1;

        window.onload = function() {
            startPracticeTest();
        };

        function startPracticeTest() {
            if (typeof questionsDB === 'undefined') {
                document.getElementById('question-text').innerText = "ചോദ്യങ്ങളുടെ ഡാറ്റാബേസ് (questionsDB) കണ്ടെത്താനായില്ല!";
                return;
            }

            practicePool = [];
            for (let subId in questionsDB) {
                if (questionsDB[subId] && Array.isArray(questionsDB[subId])) {
                    questionsDB[subId].forEach(q => {
                        let cloneQ = JSON.parse(JSON.stringify(q));
                        cloneQ.uid = Math.random().toString(36).substring(2, 9);
                        cloneQ.hasFailedBefore = false;
                        practicePool.push(cloneQ);
                    });
                }
            }

            if (practicePool.length === 0) {
                document.getElementById('question-text').innerText = "ചോദ്യങ്ങൾ ഒന്നും ലഭ്യമല്ല!";
                return;
            }

            // തുടക്കത്തിൽ ചോദ്യങ്ങൾ ഷഫിൾ ചെയ്യുന്നു
            for (let i = practicePool.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [practicePool[i], practicePool[j]] = [practicePool[j], practicePool[i]];
            }

            practiceIndex = 0;
            totalAttemptsCount = 0;
            masteredCount = 0;
            questionDisplayNumber = 1;

            loadNextQuestion();
        }

        function loadNextQuestion() {
            let notifBox = document.getElementById("error-notification");
            if (notifBox) notifBox.classList.remove("active");

            if (practiceIndex >= practicePool.length) {
                showPracticeCompletion();
                return;
            }

            let currentQuestion = practicePool[practiceIndex];
            document.getElementById('pool-count').innerText = `ബാക്കിയുള്ള ചോദ്യങ്ങൾ: ${practicePool.length - practiceIndex}`;
            document.getElementById('question-text').innerText = `${questionDisplayNumber}. ${currentQuestion.q}`;

            let optContainerEl = document.getElementById("options-container");
            optContainerEl.innerHTML = "";

            let optionsWithIndex = currentQuestion.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            // ഓരോ തവണയും ഓപ്ഷനുകൾ റാൻഡം ആയി മാറ്റുന്നു
            for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
            }

            optionsWithIndex.forEach((item) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = item.text;
                
                let isCorrect = (item.originalIndex === currentQuestion.answer);
                btn.onclick = () => checkUserAnswer(isCorrect, btn, optionsWithIndex, currentQuestion);
                optContainerEl.appendChild(btn);
            });
        }

        function checkUserAnswer(isCorrect, selectedBtn, optionsWithIndex, currentQuestion) {
            totalAttemptsCount++;
            let allButtons = document.getElementById("options-container").getElementsByTagName("button");
            for (let b of allButtons) b.style.pointerEvents = "none";

            if (isCorrect) {
                selectedBtn.style.backgroundColor = "#22c55e";
                selectedBtn.style.color = "#fff";
                selectedBtn.style.borderColor = "#22c55e";
                
                masteredCount++;
                questionDisplayNumber++;

                setTimeout(() => {
                    practiceIndex++;
                    loadNextQuestion();
                }, 600);
            } else {
                currentQuestion.hasFailedBefore = true;
                selectedBtn.style.backgroundColor = "#ef4444";
                selectedBtn.style.color = "#fff";
                selectedBtn.style.borderColor = "#ef4444";

                for (let idx = 0; idx < optionsWithIndex.length; idx++) {
                    if (optionsWithIndex[idx].originalIndex === currentQuestion.answer) {
                        allButtons[idx].style.backgroundColor = "#22c55e";
                        allButtons[idx].style.color = "#fff";
                        allButtons[idx].style.borderColor = "#22c55e";
                    }
                }

                let correctText = currentQuestion.options[currentQuestion.answer];
                let explanationText = currentQuestion.explanation || "വിശദീകരണം ലഭ്യവുമല്ല.";

                document.getElementById('notif-correct').innerText = `ശരിയായ ഉത്തരം: ${correctText}`;
                document.getElementById('notif-explanation').innerHTML = `<strong>വിശദീകരണം:</strong> ${explanationText}`;

                let notifBox = document.getElementById("error-notification");
                if (notifBox) {
                    notifBox.classList.add("active");
                    notifBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }

                // തെറ്റിയ ചോദ്യം ഒരേ ഓർഡറിൽ വരാതെ 2 മുതൽ 5 വരെയുള്ള വ്യത്യസ്ത ഇടവേളകളിൽ (Random Gap) വീണ്ടും ക്യൂവിൽ ചേർക്കുന്നു
                let randomGap = Math.floor(Math.random() * 4) + 2; 
                let reinsertPos = Math.min(practicePool.length, practiceIndex + randomGap);
                practicePool.splice(reinsertPos, 0, JSON.parse(JSON.stringify(currentQuestion)));
            }
        }

        function proceedAfterError() {
            let notifBox = document.getElementById("error-notification");
            if (notifBox) notifBox.classList.remove("active");
            
            masteredCount++;
            questionDisplayNumber++;

            practiceIndex++;
            loadNextQuestion();
        }

        function finishTest() {
            showPracticeCompletion();
        }

        function showPracticeCompletion() {
            let container = document.getElementById('practice-container');
            if (container) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <h2 style="color: #22c55e; margin-bottom: 15px;">അഭിനന്ദനങ്ങൾ! 🎉</h2>
                        <p style="font-size: 16px; color: #555; margin-bottom: 10px;">ആകെ ചെയ്ത പരിശ്രമങ്ങൾ: <b>${totalAttemptsCount}</b></p>
                        <p style="font-size: 16px; color: #555; margin-bottom: 20px;">പഠിച്ച ചോദ്യങ്ങൾ: <b style="color: #22c55e;">${masteredCount}</b></p>
                        <button style="background-color: #2563eb; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; font-size: 1rem;" onclick="goBackToHome()">ഹോമിലേക്ക് പോവുക</button>
                    </div>
                `;
            }
        }

        function goBackToPrevious() {
            window.history.back();
        }

        function goBackToHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
